<!doctype html>
<html lang="pt" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eco-Time</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
      .texto-pixelado {
        font-family: 'Pixelify Sans', sans-serif;
        font-size: 100px;
      }
      .texto-pixelado2 {
        font-family: 'Pixelify Sans', sans-serif;
        font-size: 45px;
      }
      .retangulos {
        background-color: burlywood;
        padding: 10px;
        border-radius: 8px 8px 0 0;
        color: #000;
      }
      .retangulos2 {
        background-color: darkolivegreen;
      }
      .card-bg-custom {
        background-color: hsla(258, 57%, 29%, 0.253);
      }
      .bg-verde-container {
        background-color: rgb(27, 109, 6);
      }
      .foto{
        width: 77px; 
        height: 77px; 
        border: 3px solid burlywood; 
        border-radius: 8px;
      }
    </style>
  </head>
  <body class="bg-dark text-white">
    
    <main class="container-fluid p-3">
      
      <div 
  class="position-relative overflow-hidden p-3 p-md-5 m-md-3 text-center"
  style="background-color: darkolivegreen;"
>
        <div class="col-md-6 p-lg-5 mx-auto my-5"
        style="background-color: cornflowerblue;">
          <h1 style="color: rgb(27, 112, 6);" class="texto-pixelado">Eco-Time</h1>
          <h3 class="fw-normal text-muted mb-3">Aprendendo como a tecnologia pode ser sustentável</h3>
        </div>
      </div>
      <div class="row g-3 my-3 bg-verde-container p-3 rounded mx-1">
        <div class="col-md-6">
          <div class="card-bg-custom p-3 text-center rounded">
            <div class="retangulos">
              <h2 class="texto-pixelado2">Gameplay</h2>
            </div>
            <div class="retangulos2 mx-auto" style="width: 80%; height: 350px; border-radius: 21px 21px 0 0;"></div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card-bg-custom p-3 text-center rounded">
            <div class="retangulos">
              <h2 class="texto-pixelado2">Cenários</h2>
            </div>
            <div class="bg-dark mx-auto" style="width: 80%; height: 350px; border-radius: 21px 21px 0 0;"></div>
          </div>
        </div>
      </div>

     
      <div class="row g-3 my-3 bg-verde-container p-3 rounded mx-1">
        
        <div class="col-md-6">
          <div class="card-bg-custom p-3 text-center rounded h-100 d-flex flex-column justify-content-between">
            <div class="retangulos">
              <h2 class="texto-pixelado2">Storyboards</h2>
              <div id="carouselExample" class="carousel slide">
                <div class="carousel-inner">
                  <div class="carousel-item active">
                    <img src="Captura de tela 2026-10-01 005058.png" class="d-block w-100" alt="...">
                  </div>
                  <div class="carousel-item">
                    <img src="Captura de tela 2026-10-01 005109.png" class="d-block w-100" alt="...">
                  </div>
                  <div class="carousel-item">
                    <img src="Captura de tela 2026-10-01 005119.png" class="d-block w-100" alt="...">
                  </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
                  <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                  <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                    </button>
                </div>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="p-3 rounded bg-dark h-100">
            <div class="row g-3 h-100">
              
              <div class="col-6">
                <div class="card-bg-custom p-2 text-center rounded h-100 d-flex flex-column">
                  <div class="retangulos">
                    <h3 class="texto-pixelado2 fs-4 mb-0">Equipe</h3>
                  </div>
                  <div class="bg-secondary mx-auto mt-2 w-100" style="flex-grow: 1; border-radius: 12px 12px 0 0; min-height: 350px;">
                    <p class="texto-pixelado2" style="text-align: left; font-size: x-large;"><img src="Captura de tela 2026-10-01 002649.png" class="foto">Tiago Tramontin de Paula</p>
                    <p class="texto-pixelado2" style="text-align: end; font-size: x-large;">Leonardo Carvalho Dorti<img src="Captura de tela 2026-10-01 002718.png" class="foto"></p>
                    <p class="texto-pixelado2" style="text-align: left; font-size: x-large;"><img src="Captura de tela 2026-10-01 002734.png" class="foto">Alonso Freitas Haytsmann</p>
                    <p class="texto-pixelado2" style="text-align: end; font-size: x-large;">Rodrigo Santos Araújo<img src="Captura de tela 2026-10-01 002746.png" class="foto"></p>
                    <p class="texto-pixelado2" style="text-align: left; font-size: x-large;"><img src="Captura de tela 2026-10-01 002758.png" class="foto">Eric sla o que</p>
                  </div>
                </div>
              </div>

              <div class="col-6 d-flex flex-column gap-3">
                
                <div class="card-bg-custom p-2 text-center rounded">
                  <div class="retangulos">
                    <h3 class="texto-pixelado2 fs-4 mb-0">Github</h3>
                  </div>
                  <div class="bg-secondary mx-auto mt-2 d-flex align-items-center justify-content-center" style="width: 100%; height: 160px; border-radius: 12px 12px 0 0;">
                    <a href="https://github.com/alonsohaytsmann-ai/ECOTIME/tree/main" target="_blank" rel="noopener noreferrer">
                      <img src="github.webp" style="height: 80px;">
                    </a>
                  </div>
                </div>

                <div class="card-bg-custom p-2 text-center rounded">
                  <div class="retangulos">
                    <h3 class="texto-pixelado2 fs-4 mb-0">Sinopse</h3>
                  </div>
                  <div class="bg-secondary mx-auto mt-2" style="width: 100%; height: 240px; border-radius: 12px 12px 0 0;"></div>
                </div>

              </div>

            </div>
          </div>
        </div>

      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
